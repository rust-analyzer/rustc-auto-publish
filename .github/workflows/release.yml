name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      repo_override:
        description: 'Source GitHub repository (owner/repo); blank uses rust-lang/rust'
        required: false
        type: string
      sha_override:
        description: 'Source commit SHA; blank uses HEAD of the selected repository'
        required: false
        type: string
      version_override:
        description: 'The version to publish as; blank uses the next minor version'
        required: false
        type: string
  schedule:
    # run the build every Sunday at 8am
    - cron: "0 8 * * 0"

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable && rustup default stable
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@988c164c3d0e93c4dbab36aaf5bbeb77425b2894
      - run: cargo build
      - uses: rust-lang/crates-io-auth-action@v1
        if: github.event_name != 'pull_request'
        id: auth
      - name: Publish
        run: cargo run publish "$REPO_OVERRIDE" "$SHA_OVERRIDE" "$VERSION_OVERRIDE"
        if: github.event_name != 'pull_request'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          REPO_OVERRIDE: ${{ inputs.repo_override }}
          SHA_OVERRIDE: ${{ inputs.sha_override }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
      - run: cargo run nopublish "$REPO_OVERRIDE" "$SHA_OVERRIDE" "$VERSION_OVERRIDE"
        if: github.event_name == 'pull_request'
        env:
          REPO_OVERRIDE: ${{ inputs.repo_override }}
          SHA_OVERRIDE: ${{ inputs.sha_override }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
