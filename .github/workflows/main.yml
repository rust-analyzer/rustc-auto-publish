name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      repo_override:
        description: 'Source GitHub repository (owner/repo); blank uses rust-lang/rust'
        required: false
        type: string
      sha_override:
        description: 'Source commit SHA; blank uses HEAD of the selected repository'
        required: false
        type: string
  schedule:
    # run the build every Sunday at 8am
    - cron: "0 8 * * 0"

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install Rust toolchain
        run: |
          rustup update --no-self-update stable && rustup default stable
      - name: Cache Dependencies
        uses: Swatinem/rust-cache@988c164c3d0e93c4dbab36aaf5bbeb77425b2894
      - run: cargo build
      - name: Configure crates.io token
        run: |
          echo "[registry]" > $HOME/.cargo/credentials
          echo "token = \"${{ secrets.CRATESIO_TOKEN }}\"" >> $HOME/.cargo/credentials
        if: github.event_name != 'pull_request'
      - name: Publish
        run: cargo run -- publish "$GH_TOKEN" "$REPO_OVERRIDE" "$SHA_OVERRIDE"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          REPO_OVERRIDE: ${{ inputs.repo_override }}
          SHA_OVERRIDE: ${{ inputs.sha_override }}
        if: github.event_name != 'pull_request'
      - run: cargo run nopublish ${{ secrets.GH_TOKEN }}
        if: github.event_name == 'pull_request'
